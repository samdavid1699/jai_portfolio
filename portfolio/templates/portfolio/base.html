{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Jai's Full Stack Python Developer portfolio featuring Python, Django, and web development projects.">
    <link rel="stylesheet" href="{% static 'portfolio/style.css' %}">
</head>

<body>
    <header class="navbar">
        <a href="{% url 'home' %}" class="logo">SD<span>.</span></a>

        <nav>
            <a href="#about">About</a>
            <a href="#skills">Skills</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </nav>

        <a href="#contact" class="nav-button">Let's Talk ↗</a>
    </header>

    {% if messages %}
    <div class="messages">
        {% for message in messages %}
        <p class="message {{ message.tags }}">{{ message }}</p>
        {% endfor %}
    </div>
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Designed & built with Django by Jai.</p>
        <a href="#home">Back to top ↑</a>
    </footer>
</body>

</html>
